x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build: .
    # Not published on the host: Coolify's proxy (Traefik) routes to port 8000.
    expose:
      - "8000"
    env_file: .env
    restart: unless-stopped
    mem_limit: 512m
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

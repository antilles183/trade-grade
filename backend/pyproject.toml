[project]
name = "trade-grade-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "espn-api>=0.40",
    "google-genai>=1.0",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "slowapi>=0.1.10",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
